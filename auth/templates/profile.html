<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Wavve</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .profile-container {
            max-width: 1000px;
            margin: 100px auto;
            padding: 30px;
            background-color: #1e1e2d;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .profile-header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 1px solid #3a3a4a;
        }
        
        .profile-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 30px;
            box-shadow: 0 0 10px rgba(255, 85, 136, 0.5);
        }
        
        .profile-info h1 {
            font-size: 2.5rem;
            color: #fff;
            margin-bottom: 5px;
        }
        
        .profile-username {
            color: #ff5588;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }
        
        .profile-stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
        }
        
        .stat-label {
            color: #aaa;
            font-size: 0.9rem;
        }
        
        .profile-bio {
            margin-bottom: 30px;
            color: #ddd;
            line-height: 1.6;
        }
        
        .profile-section {
            margin-bottom: 40px;
        }
        
        .profile-section h2 {
            font-size: 1.8rem;
            color: #ff5588;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #3a3a4a;
        }
        
        .playlists-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .playlist-card {
            background-color: #2a2a3a;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s;
        }
        
        .playlist-card:hover {
            transform: translateY(-5px);
        }
        
        .playlist-cover {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
        }
        
        .playlist-info {
            padding: 15px;
        }
        
        .playlist-title {
            color: #fff;
            font-weight: 600;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .playlist-tracks {
            color: #aaa;
            font-size: 0.9rem;
        }
        
        .edit-profile-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #ff5588;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        
        .edit-profile-btn:hover {
            background-color: #ff3377;
        }
        
        .flash-message {
            padding: 12px 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            font-weight: 500;
        }
        
        .flash-message.success {
            background-color: rgba(85, 255, 136, 0.2);
            border: 1px solid rgba(85, 255, 136, 0.5);
            color: #55ff88;
        }
        
        .no-playlists {
            color: #aaa;
            text-align: center;
            padding: 20px;
            background-color: #2a2a3a;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1><a href="/" style="text-decoration: none; color: inherit;">Wavve</a></h1>
        </div>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/#discover">Discover</a></li>
                <li><a href="/#trending">Trending</a></li>
                <li><a href="/#playlists">Playlists</a></li>
            </ul>
        </nav>
    </header>

    <div class="profile-container">
        <div id="flash-container"></div>
        
        <div class="profile-header">
            <img id="profile-avatar" class="profile-avatar" src="" alt="Profile Avatar">
            <div class="profile-info">
                <h1 id="display-name"></h1>
                <div class="profile-username" id="username"></div>
                <div class="profile-stats">
                    <div class="stat-item">
                        <div class="stat-value" id="playlists-count">{{ playlists_count }}</div>
                        <div class="stat-label">Playlists</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="tracks-count">{{ playlist_tracks }}</div>
                        <div class="stat-label">Saved Tracks</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="joined-date">{{ user.joined_date.strftime('%b %Y') }}</div>
                        <div class="stat-label">Joined</div>
                    </div>
                </div>
                <a href="/profile/edit" class="edit-profile-btn">Edit Profile</a>
            </div>
        </div>
        
        <div class="profile-bio" id="bio-container"></div>
        
        <div class="profile-section">
            <h2>Your Playlists</h2>
            <div class="playlists-grid" id="playlists-container">
                <!-- Playlists will be loaded here -->
                <div class="no-playlists">No playlists created yet.</div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const profileAvatar = document.getElementById('profile-avatar');
            const displayName = document.getElementById('display-name');
            const username = document.getElementById('username');
            const bioContainer = document.getElementById('bio-container');
            const playlistsCount = document.getElementById('playlists-count');
            const joinedDate = document.getElementById('joined-date');
            const playlistsContainer = document.getElementById('playlists-container');
            const flashContainer = document.getElementById('flash-container');
            
            // Check for flash messages from URL params
            const urlParams = new URLSearchParams(window.location.search);
            const flashMessage = urlParams.get('flash');
            if (flashMessage) {
                flashContainer.innerHTML = `<div class="flash-message success">${flashMessage}</div>`;
            }
            
            // Fetch user data
            fetch('/api/current_user')
                .then(response => response.json())
                .then(data => {
                    if (data.authenticated) {
                        const user = data.user;
                        
                        // Set user data
                        profileAvatar.src = user.profile_image || 'https://via.placeholder.com/150';
                        displayName.textContent = user.display_name || user.username;
                        username.textContent = '@' + user.username;
                        
                        // Set bio
                        if (user.bio) {
                            bioContainer.textContent = user.bio;
                        } else {
                            bioContainer.textContent = 'No bio yet.';
                        }
                        
                        // Format joined date
                        const date = new Date(user.joined_date || Date.now());
                        const month = date.toLocaleString('default', { month: 'short' });
                        const year = date.getFullYear();
                        joinedDate.textContent = `${month} ${year}`;
                        
                        // Fetch user playlists
                        return fetch('/api/user/playlists');
                    } else {
                        // Redirect to login if not authenticated
                        window.location.href = '/auth/login';
                    }
                })
                .then(response => response.json())
                .then(data => {
                    // Update playlists count
                    const count = data.playlists ? data.playlists.length : 0;
                    playlistsCount.textContent = count;
                    
                    // If user has playlists, display them
                    if (count > 0) {
                        playlistsContainer.innerHTML = '';
                        
                        data.playlists.forEach(playlist => {
                            const playlistCard = document.createElement('div');
                            playlistCard.className = 'playlist-card';
                            
                            playlistCard.innerHTML = `
                                <img class="playlist-cover" src="${playlist.cover_image}" alt="${playlist.title}">
                                <div class="playlist-info">
                                    <div class="playlist-title">${playlist.title}</div>
                                    <div class="playlist-tracks">${playlist.tracks.length} tracks</div>
                                </div>
                            `;
                            
                            // Add click event to navigate to playlist
                            playlistCard.addEventListener('click', () => {
                                window.location.href = `/playlist/${playlist.id}`;
                            });
                            
                            playlistsContainer.appendChild(playlistCard);
                        });
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        });
    </script>
</body>
</html>
